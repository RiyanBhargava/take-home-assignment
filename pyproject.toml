[project]
name = "dubizzle-car-assistant"
version = "1.0.0"
description = "A grounded conversational assistant for a sample used-car inventory."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.8,<3",
    "streamlit>=1.42,<2",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
